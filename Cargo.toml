[workspace]
resolver = "2"
members = [
  "crates/mycode-core",
  "crates/mycode-native",
  "apps/desktop-tauri",
]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4"
rayon = "1"
portable-pty = "0.9"
url = "2"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "process", "io-util"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dirs = "6"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
